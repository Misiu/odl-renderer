name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write  # For PyPI trusted publishing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json

      # release-please bumps the version in pyproject.toml but does not refresh
      # uv.lock (which records the project's own version). Left stale, every
      # later `uv run` rewrites uv.lock and dirties the tree / blocks commits.
      # Regenerate it on the release PR branch so the bump and lockfile land
      # together. Idempotent: re-runs each time release-please updates the PR.
      # The PR branch is only read inside `with:` (resolved when the step runs);
      # step `env:` is resolved even for skipped steps and fromJSON('') fails.
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv (lockfile sync)
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@v4

      - name: Sync uv.lock on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with release version"
            # actions/checkout created a local branch named after the PR branch
            git push origin HEAD
          fi

      # The following steps only run if a release was created
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: ${{ steps.release.outputs.release_created }}
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: uv sync

      # - name: Run tests
      #   if: ${{ steps.release.outputs.release_created }}
      #   run: |
      #     uv run python test_import.py
      #     uv run ruff check .

      - name: Build package
        if: ${{ steps.release.outputs.release_created }}
        run: uv build

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@release/v1
